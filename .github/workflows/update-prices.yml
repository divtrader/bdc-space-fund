name: Update prices

on:
  # Triggered by the pofmuis-etf "Update prices" workflow right after it runs
  # (chained via BDC_TOKEN). No own schedule — avoids double-firing.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices & build data.json
        run: python3 build_data.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          git diff --cached --quiet || git commit -m "chore: update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
